name: BluClient
options:
  bundleIdPrefix: com.rnetis
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    GCC_WARN_INHIBIT_ALL_WARNINGS: NO

targets:
  BluClient:
    type: application
    platform: iOS
    sources:
      # XcodeGen picks up .xcassets as a resource automatically; only the generated Info.plist
      # must be kept out of the compile sources.
      - path: Blu
        excludes:
          - "Resources/Info.plist"
    info:
      path: Blu/Resources/Info.plist
      properties:
        CFBundleDisplayName: Blu Client
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fa_IR
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "برای اتصال به سرویس‌های بانکی روی شبکه محلی."
        # The gateway is HTTPS only, so no arbitrary-loads exception is required.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rnetis.bluclient
        PRODUCT_NAME: BluClient
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES

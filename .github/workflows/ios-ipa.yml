name: iOS IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version override (e.g. 1.0.1). Empty = use ios/project.yml."
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"
    tags: ["v*"]

permissions:
  contents: write # attach the IPA to a release

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate --spec project.yml
          ls -1

      - name: Override marketing version
        # A bare `github.event.inputs.version != ''` is TRUE on push events, so guard on the event.
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
        working-directory: ios
        run: |
          sed -i '' "s/^    MARKETING_VERSION: .*/    MARKETING_VERSION: \"${{ github.event.inputs.version }}\"/" project.yml
          grep MARKETING_VERSION project.yml

      - name: Archive (no code signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project BluClient.xcodeproj \
            -scheme BluClient \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BluClient.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            archive

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/BluClient.xcarchive/Products/Applications/BluClient.app"
          test -d "$APP" || { echo "archive produced no .app"; exit 1; }

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"

          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          lipo -info "$APP/BluClient" # expect arm64

          cd "$RUNNER_TEMP"
          zip -qry BluClient.ipa Payload
          shasum -a 256 BluClient.ipa > BluClient.ipa.sha256
          unzip -l BluClient.ipa | head -12

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluclient-ios-unsigned-ipa
          path: |
            ${{ runner.temp }}/BluClient.ipa
            ${{ runner.temp }}/BluClient.ipa.sha256
          if-no-files-found: error
          retention-days: 60

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/BluClient.ipa
            ${{ runner.temp }}/BluClient.ipa.sha256
          generate_release_notes: true
